name: Publicar sitio Geopile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el sitio compilado
        run: |
          mkdir -p site
          curl -fsSL "$(cat SITE_BUNDLE_URL)" -o site.zip
          unzip -q site.zip -d site
          touch site/.nojekyll
          if [ -f CNAME ]; then cp CNAME site/CNAME; fi
      - name: Publicar en la rama gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publicar sitio"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
